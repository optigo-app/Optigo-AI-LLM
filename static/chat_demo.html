<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optigo Chat — Block Renderer</title>
<style>
  :root { --accent:#2563eb; --border:#e2e8f0; --muted:#64748b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin:0; background:#f8fafc; }
  #wrap { max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:#fff; border-bottom:1px solid var(--border); font-weight:600; }
  header small { color:var(--muted); font-weight:400; margin-left:8px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--border); width:100%; }
  .block { margin:8px 0; }
  .block h3 { margin:4px 0; font-size:1.05em; }
  table { border-collapse:collapse; width:100%; font-size:.9em; }
  th, td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
  th { background:#f1f5f9; }
  .metric-card { background:#f0f9ff; border:1px solid #bae6fd; border-radius:10px; padding:14px; }
  .metric-card .value { font-size:1.6em; font-weight:700; color:#0c4a6e; }
  .metric-card .sub { color:var(--muted); font-size:.85em; }
  .chip-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { border:1px solid var(--accent); color:var(--accent); border-radius:999px;
          padding:6px 14px; cursor:pointer; background:#fff; font-size:.88em; }
  .chip:hover { background:#eff6ff; }
  .chip:disabled { opacity:.45; cursor:default; }
  .pill { display:inline-block; background:#f1f5f9; border-radius:999px; padding:4px 12px;
          font-size:.82em; color:var(--muted); }
  .resolved { color:var(--muted); font-size:.85em; font-style:italic; }
  .assumption { background:#fffbeb; border:1px solid #fde68a; border-radius:8px;
                padding:8px 12px; font-size:.85em; color:#92400e; }
  .error { background:#fef2f2; border:1px solid #fecaca; border-radius:8px;
           padding:8px 12px; color:#991b1b; }
  .sources { color:var(--muted); font-size:.78em; }
  .dr { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .dr input[type=date] { padding:6px 8px; border:1px solid var(--border); border-radius:8px; }
  .dr button { padding:7px 14px; border-radius:8px; border:1px solid var(--accent);
               background:var(--accent); color:#fff; cursor:pointer; }
  ul { margin:6px 0; padding-left:20px; }
  .glossary { font-size:.82em; color:var(--muted); }
  #composer { display:flex; gap:8px; padding:12px 16px; background:#fff; border-top:1px solid var(--border); }
  #q { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:.95em; }
  #send { padding:10px 18px; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  #meta { font-size:.72em; color:var(--muted); padding:0 16px 8px; }
  .blocking-note { font-size:.75em; color:#b45309; margin-top:4px; }
</style>
</head>
<body>
<div id="wrap">
  <header>Optigo ERP Chat <small id="sess">session: —</small></header>
  <div id="log"></div>
  <div id="meta"></div>
  <div id="composer">
    <input id="q" placeholder="Ask about sales, orders, stock…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
const meta = document.getElementById('meta');
let sessionId = null;
let busy = false;

const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function bubble(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// ── Action dispatcher — the /chat/action contract ────────────────────────────
async function runAction(action, originEl, fallbackLabel) {
  if (!action || busy) return;
  if (action.handler === 'client') {   // open_report, download, etc.
    if (action.payload && action.payload.url) window.open(action.payload.url, '_blank');
    return;
  }
  busy = true;
  // Collapse the clicked widget into its resolved state (Slack/ChatKit pattern —
  // stale options can't be re-clicked).
  if (originEl) {
    const parent = originEl.closest('.chip-row, .dr, .block');
    if (parent) parent.innerHTML =
      '<span class="resolved">✓ ' + esc(action.display || fallbackLabel || action.type) + '</span>';
  }
  try {
    const r = await fetch('/chat/action', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: sessionId, action,
        company_code: 'DEMO', user_id: 'demo',
        response_mode: 'wide',
      }),
    });
    const resp = await r.json();
    renderResponse(resp);
  } catch (e) { bubble('bot', '<span class="error">Network error</span>'); }
  busy = false;
}

// ── Block renderers ──────────────────────────────────────────────────────────
const RENDER = {
  text:      b => `<div class="block">${esc(b.content)}</div>`,
  heading:   b => `<div class="block"><h3>${esc(b.content)}</h3></div>`,
  error:     b => `<div class="block error">${esc(b.content)}</div>`,
  assumption:b => `<div class="block assumption">ⓘ ${esc(b.content)}</div>`,
  period:    b => `<div class="block"><span class="pill">📅 ${esc(b.value)}</span></div>`,
  glossary:  b => `<div class="block glossary">${Object.entries(b.terms||{})
                 .map(([k,v]) => `<div><b>${esc(k)}</b>: ${esc(v)}</div>`).join('')}</div>`,
  sources:   b => `<div class="block sources">Sources: ${(b.items||[]).map(esc).join(', ')}</div>`,
  list:      b => `<div class="block">${b.title ? `<b>${esc(b.title)}</b>` : ''}<ul>${
                 (b.items||[]).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`,
  metric_card: b => `<div class="block metric-card">
                 <div>${esc(b.label)}</div><div class="value">${esc(b.value)}</div>
                 ${b.subtext ? `<div class="sub">${esc(b.subtext)}</div>` : ''}</div>`,
  table:     b => `<div class="block"><table><thead><tr>${(b.columns||[])
                 .map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
                 (b.rows||[]).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')
                 }</tbody></table></div>`,
  breakdown: b => RENDER.table(b),
  chart:     b => `<div class="block pill">📊 ${esc(b.chart_type)} chart (${(b.series||[]).length} series)</div>`,

  clarify:   b => {
    const opts = (b.options && b.options.length)
      ? b.options.map(o => o.label)
      : (b.suggestions || []);
    return `<div class="block"><b>${esc(b.content)}</b>
      ${b.blocking ? '<div class="blocking-note">Please pick an option</div>' : ''}
      <div class="chip-row">${opts.map(o =>
        `<button class="chip" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  },

  suggestions: b => `<div class="block"><div class="chip-row">${(b.items||[])
                 .map(i => `<button class="chip" data-sugg="${esc(i)}">${esc(i)}</button>`).join('')
                 }</div></div>`,

  choice_input: b => `<div class="block"><b>${esc(b.title||'')}</b><div>${esc(b.content)}</div>
                 <div class="chip-row">${(b.options||[]).map((o,i) =>
                   `<button class="chip" data-choice="${i}">${esc(o.label)}</button>`).join('')
                 }</div></div>`,

  date_range_input: b => `<div class="block"><b>${esc(b.title||'Select date range')}</b>
                 <div>${esc(b.content)}</div>
                 <div class="chip-row">${(b.presets||[]).map(p =>
                   `<button class="chip" data-preset="${esc(p.value)}">${esc(p.label)}</button>`).join('')}</div>
                 <div class="dr">
                   <input type="date" id="dr-s"> <input type="date" id="dr-e">
                   <button id="dr-go">${esc(b.submit_label||'Apply')}</button>
                 </div></div>`,
};

function renderResponse(resp) {
  if (!resp) return;
  if (resp.session_id) {
    sessionId = resp.session_id;
    document.getElementById('sess').textContent = 'session: ' + sessionId;
  }
  if (resp.error) { bubble('bot', `<span class="error">${esc(resp.error)}</span>`); return; }

  const host = bubble('bot', '');
  const parts = [];

  if (resp.blocks && resp.blocks.length) {
    for (const b of resp.blocks) {
      const fn = RENDER[b.type] || (x => `<div class="block pill">${esc(x.type)}</div>`);
      parts.push(fn(b));
    }
  } else if (resp.answer && resp.answer.value) {
    parts.push(`<div class="block">${esc(resp.answer.value)}</div>`);
  } else if (resp.answer_text) {
    parts.push(`<div class="block">${esc(resp.answer_text)}</div>`);
  }
  host.innerHTML = parts.join('');

  const m = resp.metadata || {};
  meta.textContent = `report=${resp.report?.key || resp.report_key || ''} conf=${m.intent_confidence ?? ''}` +
    ` count=${m.record_count ?? ''}${m.cache_hit ? ' (cached)' : ''}`;

  // Wire interactive elements — options carry actions; legacy message/suggestion
  // clicks fall back to sending text.
  host.querySelectorAll('[data-sugg]').forEach((el, i) => el.onclick = () => {
    const blk = (resp.blocks||[]).find(b => b.type === 'suggestions' && (b.items||[]).includes(el.dataset.sugg));
    const opt = blk && blk.options && blk.options[i];
    if (opt && opt.action) {
      bubble('user', esc(opt.action.display || opt.label));
      runAction(opt.action, el, opt.label);
    } else {
      bubble('user', esc(el.dataset.sugg));
      send(el.dataset.sugg);
      el.closest('.chip-row').innerHTML = `<span class="resolved">✓ ${esc(el.dataset.sugg)}</span>`;
    }
  });
  host.querySelectorAll('[data-opt]').forEach((el, i) => el.onclick = () => {
    const blk = (resp.blocks||[]).find(b => b.type === 'clarify');
    const opt = blk && blk.options && blk.options[i];
    if (opt && opt.action) {
      bubble('user', esc(opt.action.display || opt.label));
      runAction(opt.action, el, opt.label);
    } else { bubble('user', esc(el.dataset.opt)); send(el.dataset.opt); }
  });
  host.querySelectorAll('[data-choice]').forEach(el => el.onclick = () => {
    const blk = (resp.blocks||[]).find(b => b.type === 'choice_input');
    const opt = blk && blk.options && blk.options[el.dataset.choice];
    if (!opt) return;
    bubble('user', esc(opt.action ? (opt.action.display || opt.label) : (opt.message || opt.label)));
    if (opt.action) runAction(opt.action, el, opt.label);
    else send(opt.message || opt.label);
  });
  host.querySelectorAll('[data-preset]').forEach(el => el.onclick = () => {
    const blk = (resp.blocks||[]).find(b => b.type === 'date_range_input');
    const sa = blk && blk.submit_action;
    const payload = Object.assign({}, sa ? sa.payload : {}, {preset: el.dataset.preset});
    bubble('user', esc('Date range: ' + el.dataset.preset.replace('_', ' ')));
    runAction({type:'set_date_range', handler:'server', payload,
               display:'Date range: ' + el.dataset.preset.replace('_', ' ')}, el);
  });
  const drGo = host.querySelector('#dr-go');
  if (drGo) drGo.onclick = () => {
    const s = host.querySelector('#dr-s').value, e = host.querySelector('#dr-e').value;
    if (!s || !e) return;
    const blk = (resp.blocks||[]).find(b => b.type === 'date_range_input');
    const sa = blk && blk.submit_action;
    const payload = Object.assign({}, sa ? sa.payload : {}, {start_date: s, end_date: e});
    bubble('user', esc(`Date range: ${s} to ${e}`));
    runAction({type:'set_date_range', handler:'server', payload,
               display:`Date range: ${s} to ${e}`}, drGo);
  };
}

async function send(text) {
  const question = (text !== undefined ? text : q.value).trim();
  if (!question || busy) return;
  busy = true;
  if (text === undefined) { bubble('user', esc(question)); q.value = ''; }
  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question, session_id: sessionId,
        company_code: 'DEMO', user_id: 'demo',
        response_mode: 'wide',
      }),
    });
    renderResponse(await r.json());
  } catch (e) { bubble('bot', '<span class="error">Network error</span>'); }
  busy = false;
}

document.getElementById('send').onclick = () => send();
q.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
